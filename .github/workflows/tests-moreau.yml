name: moreau

# Badge workflow: health of the moreau integration on main.
# The weekly cron catches breakage from upstream releases between commits.
# The PR extras job and the examples sweep also install moreau; this workflow
# is the dedicated badge and the weekly upstream check.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday, offset from the Sunday examples sweep
  workflow_dispatch:

jobs:
  moreau:
    uses: ./.github/workflows/_extra.yml
    with:
      extra: moreau
