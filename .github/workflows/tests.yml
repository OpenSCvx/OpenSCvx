name: 🧪 Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # The native ICORE extension is stacked on the initial ICORE integration.
      - feature/icore_integration
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  unit:
    if: ${{ !github.event.pull_request.draft }}
    name: Unit Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # Unit tests should be fast

    strategy:
      fail-fast: false  # Continue testing other versions even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[test,plotting]"

    - name: Run unit tests
      run: |
        pytest -v -m "not e2e and not examples and not extras" --durations=10 --tb=short -n auto

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-py${{ matrix.python-version }}-${{ matrix.os }}
        path: |
          .pytest_cache/
          test-results/
        retention-days: 7

  e2e:
    needs: unit
    name: E2E Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false  # Continue testing other versions even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[test,plotting]"

    - name: Run e2e tests
      run: |
        pytest -v -m "e2e and not extras" --durations=10 --tb=short -n auto

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results-py${{ matrix.python-version }}-${{ matrix.os }}
        path: |
          .pytest_cache/
          test-results/
        retention-days: 7

  extras:
    needs: unit
    name: Extras Tests (Python 3.13, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        # cvxpygen omitted: its extra is unsatisfiable while cvxpy is pinned <1.9
        # (cvxpygen>=1.0.0 needs cvxpy>=1.9, #551); its tests skip until that resolves.
        # qpax omitted until its solves are stable on Linux runners (#550).
        uv pip install --system -e ".[test,mjx,lie,moreau]"

    - name: Run extras tests
      run: |
        pytest -v -m "extras and not examples" --durations=10 --tb=short -n auto

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: extras-test-results
        path: |
          .pytest_cache/
          test-results/
        retention-days: 7

  icore:
    needs: unit
    name: ICORE Tests (Python 3.13, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout tested ICORE revision
      uses: actions/checkout@v4
      with:
        repository: sametuzun781/ICORE
        ref: a63ebffb005725a02d2c3e4247fb73aec453e590
        path: .dependencies/icore
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        # Ubuntu runners provide the C/C++ compilers and make.
        uv pip install --system -e ".[test,plotting]" "cmake>=3.18,<4"
        echo "PYTHONPATH=$GITHUB_WORKSPACE/.dependencies/icore${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

    - name: Run ICORE tests
      run: |
        python -c "import icore; print(icore.__file__)"
        # Restrict discovery to OpenSCvx; the dependency has its own test suite.
        pytest tests -v -m "icore and not examples" --durations=10 --tb=short -n 2

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: icore-test-results
        path: |
          .pytest_cache/
          test-results/
        retention-days: 7
